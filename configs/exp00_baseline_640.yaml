# exp00_baseline_640 — PVT无物理基线 @640²（与exp01_640同协议，核心主张锚点）
seed: 42
data: {root: "./data/mcod", size: 640, cache: "./data/mcod/cache512", multiscale: true, physics_aug: true}
model:
  type: dual_baseline
  backbone_type: pvt
  v_arch: pvt_v2_b3
  nv_arch: pvt_v2_b1
  pretrained: true
  grad_ckpt: true
train: {batch: 4, workers: 2, lr: 1.0e-4, epochs: 300, eval_interval: 15}
loss: {l_iou: 1.0, l_edge: 0.5, l_ds: 0.5, l_ssim: 1.0, weighted: true,
       l_rec: 0.0, l_abd: 0.0, l_ort: 0.0, l_gate: 0.0, pos_warmup: 15, phys_warmup: 0, l_area: 1.0}
